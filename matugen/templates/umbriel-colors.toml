# Umbriel colours, generated from the wallpaper by matugen.
# In dark mode at the default settings, Theme.bgOpaque is exactly M3
# surface_container. Matugen cannot read prefs.json, so custom surfaceDarkness
# and the light-mode surfaceTint/tone ramp cannot be reproduced here; Umbriel's
# background remains opaque while Theme.bg is composited glass.
[colors]
background = "#{{colors.surface_container.default.hex_stripped}}FF"
text_primary = "#{{colors.on_surface.default.hex_stripped}}FF"
text_muted = "#{{colors.on_surface_variant.default.hex_stripped}}FF"
# Theme.accent is the M3 primary when accentPunch=1; non-default values tone-shift
# it at runtime, which the static matugen template cannot read from prefs.json.
accent_primary = "#{{colors.primary.default.hex_stripped}}FF"
accent_secondary = "#{{colors.secondary.default.hex_stripped}}FF"
warning = "#{{colors.tertiary.default.hex_stripped}}FF"
error = "#{{colors.error.default.hex_stripped}}FF"
insert_hint = "#{{colors.primary.default.hex_stripped}}80"
backdrop = "#{{colors.surface.default.hex_stripped}}FF"
shadow = "#{{colors.primary.default.hex_stripped}}66"

[colors.border]
focused = "#{{colors.primary.default.hex_stripped}}FF"
# Theme.outline tints outline_variant toward primary while preserving tone. Use
# the source-harmonized M3 base role; matugen cannot duplicate Theme.tint's RGB/L* blend.
unfocused = "#{{colors.outline_variant.default.hex_stripped}}FF"
outer = "#{{colors.primary.default.hex_stripped}}40"
